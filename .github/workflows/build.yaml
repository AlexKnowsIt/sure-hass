name: Build and publish

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "sure/**"
      - ".github/workflows/build.yaml"
      - ".github/bump.sh"
  schedule:
    - cron: "17 3 * * 1" # Weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sure_version: ${{ steps.v.outputs.sure_version }}
      addon_version: ${{ steps.v.outputs.addon_version }}
      changed: ${{ steps.v.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - name: Determine versions
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          current=$(grep -oP '(?<=^ARG SURE_VERSION=).+' sure/Dockerfile)
          addon=$(grep -oP '(?<=^version: )[^-]+' sure/config.yaml)
          sure=$current
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            # Skip prereleases: upstream tags those v*-alpha.* and publishes them
            # as the "latest" image tag, while real releases are stable.
            sure=$(gh release list --repo we-promise/sure --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
            sure=${sure#v}
            # The value ends up in sed and shell later, so accept known shapes only
            # (0.7.6, 0.7.5-hotfix.3, 2026.1.5).
            if ! [[ "$sure" =~ ^[0-9]+(\.[0-9]+)*(-hotfix\.[0-9]+)?$ ]]; then
              echo "Unexpected upstream version: '$sure'" >&2
              exit 1
            fi
            if [ "$sure" != "$current" ]; then
              token=$(curl -fsSL "https://ghcr.io/token?scope=repository%3Awe-promise%2Fsure%3Apull&service=ghcr.io" | jq -r '.token')
              status=$(curl -s -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer $token" \
                -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
                "https://ghcr.io/v2/we-promise/sure/manifests/${sure}")
              if [ "$status" != 200 ]; then
                echo "ghcr.io/we-promise/sure:${sure} is not published yet (HTTP $status)" >&2
                exit 1
              fi
            fi
          fi
          {
            echo "sure_version=$sure"
            echo "addon_version=${addon}-${sure}"
            [ "$sure" != "$current" ] && echo "changed=true" || echo "changed=false"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    # A scheduled run with nothing new has nothing to build.
    if: github.event_name != 'schedule' || needs.prepare.outputs.changed == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      SURE_VERSION: ${{ needs.prepare.outputs.sure_version }}
      ADDON_VERSION: ${{ needs.prepare.outputs.addon_version }}
      ARCH: ${{ matrix.arch }}
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Apply version bump
        run: |
          .github/bump.sh "$SURE_VERSION"
          grep -qx "ARG SURE_VERSION=${SURE_VERSION}" sure/Dockerfile
          grep -qx "version: ${ADDON_VERSION}" sure/config.yaml

      - name: Build image
        run: docker build -t sure-test sure

      - name: Smoke test
        run: |
          set -euo pipefail
          data=$(mktemp -d)
          echo '{"onboarding_state":"open","env_vars":[]}' > "$data/options.json"

          start() {
            docker run -d --name sure -v "$data:/data" -p 3000:3000 sure-test
            for _ in $(seq 60); do
              [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/up)" = 200 ] && return 0
              # A container that died will never answer; do not wait it out.
              [ "$(docker inspect -f '{{.State.Running}}' sure)" = true ] || break
              sleep 5
            done
            echo "Health check never returned 200" >&2
            return 1
          }
          stop() {
            docker stop -t 120 sure
            [ "$(docker inspect -f '{{.State.ExitCode}}' sure)" = 0 ] || { echo "Unclean exit" >&2; return 1; }
            docker rm sure
          }
          fail() { docker logs sure || true; exit 1; }

          start || fail
          stop || fail
          # Second start on the same /data: proves persistence and the
          # pre-migration dump path.
          start || fail
          docker exec sure sh -c 'ls /data/backups/*.dump' || fail

          # Restore test: a dump written by the add-on must bring back data
          # that was lost after it, using the commands from sure/README.md.
          db() { docker exec sure psql -h /run/postgresql -U sure -v ON_ERROR_STOP=1 -tAc "$1" "${2:-sure}"; }
          db "CREATE TABLE restore_check (v text); INSERT INTO restore_check VALUES ('ok')" || fail
          stop || fail
          # Third start: the pre-migration dump now contains the marker.
          start || fail
          dump=$(docker exec sure sh -c 'ls -1t /data/backups/*.dump | head -n 1') || fail
          db "DROP TABLE restore_check" || fail
          db "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='sure' AND pid <> pg_backend_pid()" postgres || fail
          docker exec sure pg_restore -h /run/postgresql -U sure -d postgres --clean --if-exists --create "$dump" || fail
          stop || fail
          start || fail
          [ "$(db 'SELECT v FROM restore_check')" = ok ] || { echo "Restored database lacks the marker" >&2; fail; }
          stop || fail

      - name: Log in to ghcr.io
        if: env.EVENT != 'pull_request'
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        if: env.EVENT != 'pull_request'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${ARCH}-sure-homeassistant"
          for tag in "$ADDON_VERSION" latest; do
            docker tag sure-test "$image:$tag"
            docker push "$image:$tag"
          done

  # Home Assistant reads config.yaml from the default branch, so the images must
  # be pushed BEFORE the version bump lands here. A push made with GITHUB_TOKEN
  # does not trigger workflows, so this commit cannot start a loop.
  commit:
    needs: [prepare, build]
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SURE_VERSION: ${{ needs.prepare.outputs.sure_version }}
      ADDON_VERSION: ${{ needs.prepare.outputs.addon_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Bump, update changelog, push
        run: |
          set -euo pipefail
          .github/bump.sh "$SURE_VERSION"
          printf '## %s\n\n- Update Sure to %s. Release notes: https://github.com/we-promise/sure/releases/tag/v%s\n\n' \
            "$ADDON_VERSION" "$SURE_VERSION" "$SURE_VERSION" > /tmp/entry.md
          awk 'FNR==NR { e = e $0 "\n"; next } !d && /^## / { printf "%s", e; d=1 } { print }' /tmp/entry.md sure/CHANGELOG.md > /tmp/changelog.md
          mv /tmp/changelog.md sure/CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sure/Dockerfile sure/config.yaml sure/CHANGELOG.md
          git commit -m "chore: update Sure to ${SURE_VERSION}"
          git push origin HEAD:main
