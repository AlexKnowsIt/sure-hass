name: Sure (Finances)
description: >-
  Sure is a personal finance management application that helps you track your
  expenses, income, and investments. PostgreSQL and Redis are bundled.
version: 1.0.1-0.7.6
slug: sure
image: ghcr.io/alexknowsit/{arch}-sure-homeassistant
url: https://github.com/AlexKnowsIt/sure-hass
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# Cold backup: Home Assistant stops the add-on first, so the PostgreSQL files
# in /data are consistent.
backup: cold
# Sidekiq alone may take 25s to drain; PostgreSQL must get its turn to shut down
# cleanly before the Supervisor kills the container.
timeout: 120
watchdog: "http://[HOST]:[PORT:3000]/up"
webui: "http://[HOST]:[PORT:3000]"
ports:
  3000/tcp: 1234
schema:
  onboarding_state: list(open|invite_only|closed)
  # Escape hatch for anything Sure reads that this addon has no option for.
  # A list of dicts is "required" to the Supervisor -- unlike ["str?"], it has no
  # per-entry optional marker -- so the empty default below has to stay.
  env_vars:
    - name: str
      value: str
options:
  onboarding_state: "open"
  env_vars: []
